http:
  routers:

    nextcloud-cf:
      rule: "Host(`nc.node-forge.eu`)"
      entryPoints:
        - websecure
      tls: 
        certResolver: cloudflare
      service: nextcloud
      middlewares:
        - nextcloud-headers
    jellyfin-cf:
      rule: "Host(`jellyfin.node-forge.eu`)"
      entryPoints:
        - websecure
      tls: 
        certResolver: cloudflare
      service: jellyfin
      
    adguard:
      rule: "Host(`ad.node-forge.eu`)"
      entryPoints:
        - websecure
      tls: 
        certResolver: cloudflare
      service: adguard

    homeassistant:
      rule: "Host(`ha.lan`)"
      entryPoints:
        - websecure
      tls: {}
      service: homeassistant

    fritz:
      rule: "Host(`fritz.box`)"
      entryPoints:
        - websecure
      tls: {}
      service: fritz

    prometheus:
      rule: "Host(`prom.lan`)"
      entryPoints:
        - websecure
      tls: {}
      service: prometheus

    ntfy:
      rule: "Host(`ntfy.node-forge.eu`)"
      entryPoints:
        - web
      service: ntfy
    matrix:
      rule: "Host(`matrix.node-forge.eu`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: matrix
  middlewares:
    nextcloud-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          X-Forwarded-Ssl: "on"

  services:
    nextcloud:
      loadBalancer:
        servers:
          - url: "http://192.168.178.69:8080"
    jellyfin:
      loadBalancer:
        servers:
          - url: "http://192.168.178.69:8096"
    adguard:
      loadBalancer:
        servers:
          - url: "http://192.168.178.76:80"

    homeassistant:
      loadBalancer:
        servers:
          - url: "http://192.168.178.75:8123"

    fritz:
      loadBalancer:
        servers:
          - url: "http://192.168.178.1"

    prometheus:
      loadBalancer:
        servers:
          - url: "http://192.168.178.77:9090"

    ntfy:
      loadBalancer:
        servers:
          - url: "http://192.168.178.77:2586"
    
    matrix:
      loadBalancer:
        servers:
          - url: "http://192.168.178.78:8008"
